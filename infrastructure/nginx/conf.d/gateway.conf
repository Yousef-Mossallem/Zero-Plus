# ======================================================
# Zero Plus Edge — HTTP + HTTPS (نفس المنطق تطوير/إنتاج)
# ======================================================

# تنظيف هيدرز يحاول الزائر يزوّر بيها البصمة
# (Nest proxy_set_header لاحقًا يملأها من TLS فقط)

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # إنتاج: فعّل التوجيه الإجباري لـ HTTPS
    # set $redirect_https 1;  عبر env في entrypoint لو حابب
    # if ($redirect_https) { return 301 https://$host$request_uri; }

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx-ok\n";
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;
        limit_conn conn 60;
        limit_conn_status 429;

        proxy_pass http://zero_plus_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # بصمات من الحافة فقط — مش من طلب الزائر
        proxy_set_header X-JA4             $edge_ja4;
        proxy_set_header X-JA3             $edge_ja3;
        proxy_set_header X-TLS-Version     $ssl_protocol;
        proxy_set_header X-TLS-Cipher      $ssl_cipher;
        proxy_set_header X-Edge-Server     "zero-plus-nginx";

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_buffering       on;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS — في التطوير على localhost المتصفح قد يبقى صارم؛ للإنتاج مطلوب
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "nginx-ok-ssl\n";
    }

    location / {
        limit_req zone=general burst=50 nodelay;
        limit_req_status 429;
        limit_conn conn 60;

        proxy_pass http://zero_plus_gateway;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # من مصافحة TLS الحقيقية (الموديول في الـ image)
        proxy_set_header X-JA4             $edge_ja4;
        proxy_set_header X-JA3             $edge_ja3;
        proxy_set_header X-TLS-Version     $ssl_protocol;
        proxy_set_header X-TLS-Cipher      $ssl_cipher;
        proxy_set_header X-Edge-Server     "zero-plus-nginx";

        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}