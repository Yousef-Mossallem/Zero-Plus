worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'ja3="$ssl_ja3" ja4="$ssl_ja4" '
                    'tls="$ssl_protocol" cipher="$ssl_cipher" '
                    'xff="$proxy_add_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    reset_timedout_connection on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    limit_req_zone  $binary_remote_addr zone=general:30m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=strict:20m  rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=conn:20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # لو الموديول مش متاح، المتغيرات تبقى فاضي — الـ Gateway يتعامل
    map $ssl_ja4 $edge_ja4 {
        default $ssl_ja4;
        ''      "";
    }
    map $ssl_ja3 $edge_ja3 {
        default $ssl_ja3;
        ''      "";
    }

    upstream zero_plus_gateway {
        server gateway:3000 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    include /etc/nginx/conf.d/*.conf;
}