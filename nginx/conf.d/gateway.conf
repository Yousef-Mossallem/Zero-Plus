# ======================================================
# Zero Plus - Gateway Virtual Host
# ======================================================

# -------------------- HTTP → Redirect to HTTPS (إنتاج) --------------------
server {
    listen 80;
    server_name _;

    # في التطوير نسمح بـ HTTP عادي
    # في الإنتاج شيل الكومنت تحت عشان يعمل redirect
    # return 301 https://$host$request_uri;

    # ----- للتطوير: نشتغل على HTTP -----
    location /health {
        access_log off;
        return 200 'nginx-ok';
        add_header Content-Type text/plain;
    }

    location / {
        # Rate Limiting الأولي
        limit_req zone=general burst=40 nodelay;
        limit_conn addr 50;

        proxy_pass http://zero_plus_gateway;
        proxy_http_version 1.1;

        # ----- Headers مهمة جدًا -----
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # JA3 / JA4 (هتتفعل لما نستخدم صورة فيها الموديول)
        # proxy_set_header X-JA3             $ssl_ja3;
        # proxy_set_header X-JA4             $ssl_ja4;
        # proxy_set_header X-TLS-Version     $ssl_protocol;
        # proxy_set_header X-TLS-Cipher      $ssl_cipher;

        # حالياً بنبعت قيم تجريبية عشان الـ Gateway يتختبر
        proxy_set_header X-JA4             $http_x_ja4;
        proxy_set_header X-JA3             $http_x_ja3;

        # Connection
        proxy_set_header Connection        "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        # WebSocket support (لو هتستخدم Socket.IO من خلاله)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# -------------------- HTTPS Server (إنتاج) --------------------
