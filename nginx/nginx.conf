# ======================================================
# Zero Plus Gateway - Main Nginx Configuration
# ======================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------- Logging --------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format fingerprint '$remote_addr - [$time_local] '
                           'ja3="$ssl_ja3" ja4="$ssl_ja4" '
                           'proto="$ssl_protocol" cipher="$ssl_cipher" '
                           '"$request" $status';

    access_log /var/log/nginx/access.log main;

    # -------------------- Performance --------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # -------------------- Gzip --------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # -------------------- Rate Limiting Zones --------------------
    # حسب الدوسيه: طبقة أولى بتقتل جزء كبير من الهجمات
    limit_req_zone $binary_remote_addr zone=general:20m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=strict:20m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:20m;

    # -------------------- Upstream (الـ Gateway) --------------------
    upstream zero_plus_gateway {
        # لو عندك أكتر من instance حطهم هنا
        server gateway:3000 max_fails=3 fail_timeout=10s;
        # server gateway2:3000;
        keepalive 32;
    }

    # -------------------- Include Virtual Hosts --------------------
    include /etc/nginx/conf.d/*.conf;
}