# ==================================================================
# Zero Plus - docker-compose.yml
# الشهر الأول: PostgreSQL + Redis بس
# الخدمات السبعة الباقية (frontend, backend, gateway, ai-service, nginx)
# هتتضاف هنا في مرحلة النشر (الشهر اللي بعده) - مش هيتلمس الجزء ده خالص
# ==================================================================

services:

  # ----------------------------------------------------------------
  # PostgreSQL - قاعدة البيانات الدائمة
  # هنا بيتخزن: المستخدمين، الشركات، السيرفرات، الأحداث الأمنية، السمعة
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    # postgres:16 = نسخة مستقرة وحديثة
    # alpine = نسخة خفيفة الحجم من نظام التشغيل جوه الصورة (أسرع تحميل)

    container_name: zeroplus-postgres
    # اسم واضح للحاوية عشان تعرفها بسهولة في Docker Desktop

    restart: unless-stopped
    # لو الجهاز اتقفل أو الحاوية وقعت بالغلط، تشتغل تاني تلقائياً
    # إلا لو انت اللي وقفتها يدوياً بنفسك (unless-stopped بيحترم قرارك)

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # القيم دي بتتجاب من ملف .env في نفس المكان (هنعمله دلوقتي تحت)
      # مش بنكتب الباسورد مباشرة هنا عشان الأمان ومتنرفعش على Git بالغلط

    ports:
      - "${POSTGRES_PORT}:5432"
      # بيربط بورت جهازك (من .env) بالبورت الداخلي بتاع PostgreSQL (5432 ثابت دايماً)
      # كده تقدر تتصل بيه من جهازك مباشرة (من Prisma مثلاً) على localhost

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # مهم جداً: من غير السطر ده، أي بيانات تتسجل هتضيع لو الحاوية اتمسحت
      # الـ volume ده بيخلي البيانات محفوظة على جهازك بشكل دائم

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
      # كل 5 ثواني، Docker بيتأكد إن قاعدة البيانات فعلاً جاهزة تستقبل اتصالات
      # ده هيفيدنا قريب لما نضيف الـ Backend، عشان يستنى القاعدة تجهز الأول

    networks:
      - zeroplus-network
      # كل الخدمات على نفس الشبكة الداخلية دي، عشان تقدر تتكلم مع بعضها بأسمائها

  # ----------------------------------------------------------------
  # Redis - الذاكرة السريعة المؤقتة
  # هنا هيتخزن لاحقاً: عدّادات الطلبات اللحظية، الـ Rate Limiting
  # الشهر ده لسه مش مستخدم فعلياً من أي كود، بس لازم يكون جاهز وشغال
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # نسخة مستقرة وخفيفة

    container_name: zeroplus-redis

    restart: unless-stopped

    ports:
      - "${REDIS_PORT}:6379"
      # 6379 هو البورت الداخلي الثابت بتاع Redis دايماً

    volumes:
      - redis_data:/data
      # حفظ بيانات Redis دائماً حتى لو الحاوية اتقفلت وفتحت تاني

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      # نفس فكرة الفحص بتاع PostgreSQL، بس بأمر خاص بـ Redis

    networks:
      - zeroplus-network

# ==================================================================
# تعريف الـ Volumes (المساحات الدائمة للحفظ)
# لازم تتعرف هنا في الآخر عشان Docker يعرف يديرها
# ==================================================================
volumes:
  postgres_data:
  redis_data:

# ==================================================================
# تعريف الشبكة الداخلية المشتركة بين كل الخدمات
# ==================================================================
networks:
  zeroplus-network:
    driver: bridge
    # bridge = النوع القياسي للشبكات الداخلية بين حاويات على نفس الجهاز